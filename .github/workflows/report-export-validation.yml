name: Report Export Validation

on:
  push:
    branches:
      - main
      - fix/executive-report-export
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-report-export:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate report export contract
        run: npm run test:report

      - name: Build production application
        run: npm run build
