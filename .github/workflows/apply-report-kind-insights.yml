name: Apply Report Kind Insights

on:
  push:
    branches:
      - feat/central-relatorios-dinamicos

permissions:
  contents: write

jobs:
  apply-report-kind-insights:
    if: ${{ !contains(github.event.head_commit.message, '[report-kind-insights-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/central-relatorios-dinamicos
          fetch-depth: 0
      - name: Pass selected model to insights
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/relatorios/page.tsx')
          source = path.read_text(encoding='utf-8')
          old = 'insights: buildReportInsights(current, previous, previousYear),'
          new = 'insights: buildReportInsights(current, previous, previousYear, config.kind),'
          if old not in source:
              raise SystemExit('Expected insights call not found.')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit model insights
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/relatorios/page.tsx
          git commit -m "feat(reporting): use model-specific insights [report-kind-insights-applied]"
          git push origin HEAD:feat/central-relatorios-dinamicos
