name: Apply Report Review Fixes

on:
  push:
    branches:
      - fix/executive-report-export

permissions:
  contents: write

jobs:
  apply-review-fixes:
    if: ${{ !contains(github.event.head_commit.message, '[review-fixes-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/executive-report-export
          fetch-depth: 0

      - name: Apply validated review fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          page_path = Path('app/relatorios/page.tsx')
          page = page_path.read_text(encoding='utf-8')

          page = page.replace(
              "import React, { useCallback, useEffect, useMemo, useState } from 'react';\n",
              "import React, { useCallback, useEffect, useMemo, useState } from 'react';\nimport { flushSync } from 'react-dom';\n",
              1,
          )
          page = page.replace(
              "window.setTimeout(() => URL.revokeObjectURL(url), 0);",
              "window.setTimeout(() => URL.revokeObjectURL(url), 1000);",
              1,
          )

          old_print = """    const exportDate = new Date();
              setGeneratedAt(exportDate);
              const previousTitle = document.title;
              document.title = buildReportFileName('pdf', exportDate).replace(/\\.pdf$/, '');

              const restoreTitle = () => {
                document.title = previousTitle;
                window.removeEventListener('afterprint', restoreTitle);
              };

              window.addEventListener('afterprint', restoreTitle);
              window.requestAnimationFrame(() => window.print());"""
          new_print = """    const exportDate = new Date();
              flushSync(() => setGeneratedAt(exportDate));
              const previousTitle = document.title;
              document.title = buildReportFileName('pdf', exportDate).replace(/\\.pdf$/, '');
              let titleRestored = false;

              const restoreTitle = () => {
                if (titleRestored) return;
                titleRestored = true;
                document.title = previousTitle;
                window.removeEventListener('afterprint', restoreTitle);
              };

              window.addEventListener('afterprint', restoreTitle);
              window.print();
              window.setTimeout(restoreTitle, 2000);"""
          if old_print not in page:
              raise SystemExit('Expected print handler block was not found.')
          page = page.replace(old_print, new_print, 1)
          page_path.write_text(page, encoding='utf-8')

          css_path = Path('app/globals.css')
          css = css_path.read_text(encoding='utf-8')
          old_css = """  .report-reference,
            .report-date,
            .report-number { white-space: nowrap !important; }

            .report-reference { color: #0f172a !important; font-weight: 900 !important; }"""
          new_css = """  .report-date,
            .report-number { white-space: nowrap !important; }

            .report-reference {
              color: #0f172a !important;
              font-weight: 900 !important;
              white-space: normal !important;
              overflow-wrap: anywhere !important;
              word-break: normal !important;
            }"""
          if old_css not in css:
              raise SystemExit('Expected report reference CSS block was not found.')
          css_path.write_text(css.replace(old_css, new_css, 1), encoding='utf-8')

          test_path = Path('tests/reportExport.test.ts')
          tests = test_path.read_text(encoding='utf-8')
          old_date = "const date = new Date('2026-07-29T18:30:00-03:00');"
          new_date = "const date = new Date(2026, 6, 29, 12, 0, 0);"
          if old_date not in tests:
              raise SystemExit('Expected filename test date was not found.')
          test_path.write_text(tests.replace(old_date, new_date, 1), encoding='utf-8')

          layout_path = Path('app/relatorios/layout.tsx')
          if layout_path.exists():
              layout_path.unlink()
          PY

      - name: Commit corrected report export
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/relatorios/page.tsx app/globals.css tests/reportExport.test.ts
          git add -u app/relatorios/layout.tsx
          git commit -m "fix(report): address final export review [review-fixes-applied]"
          git push origin HEAD:fix/executive-report-export
