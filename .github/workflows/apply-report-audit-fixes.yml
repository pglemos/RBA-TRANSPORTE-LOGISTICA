name: Apply Report Audit Fixes

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-report-audit-fixes:
    if: ${{ github.event_name == 'pull_request' || !contains(github.event.head_commit.message, '[report-audit-fixed]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Assemble and verify audited patch
        run: |
          cat > /tmp/chunk-hashes <<'HASHES'
          101a4ca369d511f60dcc0817269d93695768a3d7518698dc4321b1d1b62da2fd  scripts/report-audit-patch/part-00.b64
          39a2c88ccdf03756798a2c32047231ea863de6232d529b63b79cd1aa661ebbb1  scripts/report-audit-patch/part-01.b64
          8c981d41cc37ebbe217fefe94cddbf6e520f79a7508ffa7abd67fa9005fbc81c  scripts/report-audit-patch/part-02-00.b64
          41203ad4133d90af972d5ace4fc794982060a3ce9f2afda5f7d4407d31f196fc  scripts/report-audit-patch/part-02-01.b64
          03032dad10558aa1eb6b4446755241965a275bc8dd7f55e27172ff7415b8bc27  scripts/report-audit-patch/part-02-02.b64
          96105d259e233ee766c294a9db128a7043ea50f24e973971428af2663862eac9  scripts/report-audit-patch/part-02-03.b64
          c6a39bf82fefd0064b1fb71f87e1a5edcfa952246beb61f6fee6cd4f8a7a5691  scripts/report-audit-patch/part-03.b64
          a68b402febf9d6a4416fb04ca41ded54674c67d3b4b3a5d4fd99b1b05bc46fe1  scripts/report-audit-patch/part-04-00.b64
          f84d07dac104ade8088be1e67d38310495d2860f0f7dc2e92d99b5120d0834e0  scripts/report-audit-patch/part-04-01.b64
          89c482f25b844c9198dd03e78aed8a2063a8640516cfc45708e0b66df183aa05  scripts/report-audit-patch/part-04-02.b64
          bd8502fba8c8be9836630a1cabefa5287c4e3366d8ba14f01155d7a4115c2da5  scripts/report-audit-patch/part-04-03.b64
          dd419309671a42e4b6fa7f591c10a2f3c8457536c58abf25b6854c4e4691889a  scripts/report-audit-patch/part-05-00.b64
          783514540577a95f8716327a10e9ddac314db4e346d72280f4a8bcebc501552e  scripts/report-audit-patch/part-05-01.b64
          fbcd589011adb49f8b51c5bd749aceb94cc327ddc7ef1975c59544165d58fcec  scripts/report-audit-patch/part-05-02.b64
          HASHES
          sha256sum --check /tmp/chunk-hashes
          cat scripts/report-audit-patch/part-*.b64 | tr -d '\r\n\t ' > /tmp/apply_report_audit_fixes.py.b64
          base64 --decode /tmp/apply_report_audit_fixes.py.b64 > /tmp/apply_report_audit_fixes.py
          python -m py_compile /tmp/apply_report_audit_fixes.py
          test "$(wc -c < /tmp/apply_report_audit_fixes.py)" = "64699"
          echo "763c98cb944d90496b928b43e05a923c1010bb0f8186e342ec1932bb2a0a1d76  /tmp/apply_report_audit_fixes.py" | sha256sum --check

      - name: Apply audited report corrections
        run: python /tmp/apply_report_audit_fixes.py

      - name: Preserve compatibility and updated metric contracts
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              if old not in text:
                  raise RuntimeError(f'Pattern not found in {path}: {old[:80]!r}')
              target.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'tests/reportingAnalytics.test.ts',
              'analytics.recurrence.leadingClientDependencyPercent, 60',
              'analytics.recurrence.leadingClientDependencyPercent, 50',
          )
          replace_once(
              'tests/reportingExports.test.ts',
              "    'Resumo Executivo',\n    'Executivo',\n    'Comparações',\n    'Insights',\n    'Base de Ordens',",
              "    'Resumo Executivo',\n    'Comparações',\n    'Insights',\n    'Qualidade dos Dados',\n    'Base de Ordens',",
          )
          replace_once('lib/reporting/excelDynamic.ts', 'generatedAt: Date;', 'generatedAt?: Date;')
          replace_once(
              'lib/reporting/excelDynamic.ts',
              "input.generatedAt.toLocaleString('pt-BR')",
              "(input.generatedAt || new Date()).toLocaleString('pt-BR')",
          )
          replace_once(
              'lib/reporting/excelDynamic.ts',
              'workbook.created = input.generatedAt; workbook.modified = input.generatedAt;',
              'const generatedAt = input.generatedAt || new Date(); workbook.created = generatedAt; workbook.modified = generatedAt;',
          )
          PY

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run report regression tests
        run: npm run test:report

      - name: Build production application
        run: npm run build

      - name: Commit validated corrections to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r scripts/report-audit-patch
          git rm .github/workflows/apply-report-audit-fixes.yml
          git add app components lib tests docs
          git commit -m 'fix(reports): corrigir dados PDF Excel e CSV [report-audit-fixed]'
          git push origin main
