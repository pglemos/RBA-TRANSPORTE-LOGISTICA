name: Apply Report Timestamp Fix

on:
  push:
    branches:
      - fix/executive-report-export

permissions:
  contents: write

jobs:
  apply-timestamp-fix:
    if: ${{ !contains(github.event.head_commit.message, '[timestamp-fix-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/executive-report-export
          fetch-depth: 0

      - name: Remove flushSync dependency and update timestamp synchronously
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/relatorios/page.tsx')
          source = path.read_text(encoding='utf-8')

          source = source.replace("import { flushSync } from 'react-dom';\n", '', 1)
          source = source.replace(
              "    flushSync(() => setGeneratedAt(exportDate));",
              """    setGeneratedAt(exportDate);
              document.querySelectorAll<HTMLElement>('[data-report-generated-at]').forEach((element) => {
                element.textContent = formatGeneratedAt(exportDate);
              });""",
              1,
          )
          source = source.replace(
              "<strong>Emitido em {formatGeneratedAt(generatedAt)}</strong>",
              "<strong>Emitido em <span data-report-generated-at>{formatGeneratedAt(generatedAt)}</span></strong>",
              1,
          )
          source = source.replace(
              "<span>Gerado em {formatGeneratedAt(generatedAt)}</span>",
              "<span>Gerado em <span data-report-generated-at>{formatGeneratedAt(generatedAt)}</span></span>",
              1,
          )

          path.write_text(source, encoding='utf-8')
          PY

      - name: Commit timestamp correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/relatorios/page.tsx
          git commit -m "fix(report): synchronize print timestamp without extra types [timestamp-fix-applied]"
          git push origin HEAD:fix/executive-report-export
