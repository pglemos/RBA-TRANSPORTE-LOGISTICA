name: Apply Reporting Review Fixes

on:
  push:
    branches:
      - feat/central-relatorios-dinamicos

permissions:
  contents: write

jobs:
  apply-reporting-review-fixes:
    if: ${{ !contains(github.event.head_commit.message, '[reporting-review-fixes-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/central-relatorios-dinamicos
          fetch-depth: 0
      - name: Apply review fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          css = Path('app/relatorios/reporting.css')
          source = css.read_text(encoding='utf-8')
          if not source.startswith('/* stylelint-disable property-no-deprecated */'):
              source = '/* stylelint-disable property-no-deprecated */\n' + source
          source = source.replace('size: A4 landscape;', 'size: a4 landscape;')
          source = source.replace("'Inter'", 'Inter').replace("'Outfit'", 'Outfit')
          css.write_text(source, encoding='utf-8')

          periods = Path('lib/reporting/periods.ts')
          source = periods.read_text(encoding='utf-8')
          source = source.replace(
              "export function getPreviousMonthRange(year: number, month: number): DateRange {\n  if (!Number.isInteger(year) || !Number.isInteger(month)) throw new Error('Mês inválido.');",
              "export function getPreviousMonthRange(year: number, month: number): DateRange {\n  if (!Number.isInteger(year) || year < 2000 || year > 9999) throw new Error('Ano inválido.');\n  if (!Number.isInteger(month) || month < 1 || month > 12) throw new Error('Mês inválido.');",
              1,
          )
          periods.write_text(source, encoding='utf-8')

          builder = Path('components/reports/ReportBuilder.tsx')
          source = builder.read_text(encoding='utf-8')
          replacements = {
              '<label className={labelClassName}>Mês do relatório</label>': '<label htmlFor="report-month" className={labelClassName}>Mês do relatório</label>',
              '<input type="month" value={config.monthValue}': '<input id="report-month" type="month" value={config.monthValue}',
              '<label className={labelClassName}>Ano do relatório</label>': '<label htmlFor="report-year" className={labelClassName}>Ano do relatório</label>',
              '<input type="number" min="2000"': '<input id="report-year" type="number" min="2000"',
              '<label className={labelClassName}>Data inicial</label>': '<label htmlFor="report-start-date" className={labelClassName}>Data inicial</label>',
              '<input type="date" value={config.startDate}': '<input id="report-start-date" type="date" value={config.startDate}',
              '<label className={labelClassName}>Data final</label>': '<label htmlFor="report-end-date" className={labelClassName}>Data final</label>',
              '<input type="date" value={config.endDate}': '<input id="report-end-date" type="date" value={config.endDate}',
              '<label className={labelClassName}>Cliente</label>': '<label htmlFor="report-client" className={labelClassName}>Cliente</label>',
              '<select value={config.clientId}': '<select id="report-client" value={config.clientId}',
              '<label className={labelClassName}>Motorista</label>': '<label htmlFor="report-driver" className={labelClassName}>Motorista</label>',
              '<select value={config.driverId}': '<select id="report-driver" value={config.driverId}',
              '<label className={labelClassName}>Status operacional</label>': '<label htmlFor="report-status" className={labelClassName}>Status operacional</label>',
              '<select value={config.status}': '<select id="report-status" value={config.status}',
              '<label className={labelClassName}>Origem contém</label>': '<label htmlFor="report-origin" className={labelClassName}>Origem contém</label>',
              '<input value={config.origin}': '<input id="report-origin" value={config.origin}',
              '<label className={labelClassName}>Destino contém</label>': '<label htmlFor="report-destination" className={labelClassName}>Destino contém</label>',
              '<input value={config.destination}': '<input id="report-destination" value={config.destination}',
              '<label className={labelClassName}>Busca geral</label>': '<label htmlFor="report-search" className={labelClassName}>Busca geral</label>',
              '<input value={config.search}': '<input id="report-search" value={config.search}',
              '<label className={labelClassName}>Itens nos rankings</label>': '<label htmlFor="report-ranking-limit" className={labelClassName}>Itens nos rankings</label>',
              '<select value={config.rankingLimit}': '<select id="report-ranking-limit" value={config.rankingLimit}',
          }
          for old, new in replacements.items():
              if old not in source:
                  raise SystemExit(f'Missing builder pattern: {old}')
              source = source.replace(old, new, 1)
          builder.write_text(source, encoding='utf-8')

          excel = Path('lib/reporting/excel.ts')
          source = excel.read_text(encoding='utf-8')
          source = source.replace(
              "function addModelSheet(sheet: ExcelJS.Worksheet, input: ReportWorkbookInput) {\n  addBrandHeader(sheet, `Relatório de ${MODEL_LABELS[input.kind]}`, input.periodLabel, input.filtersLabel);",
              "function addModelSheet(sheet: ExcelJS.Worksheet, input: ReportWorkbookInput) {\n  addBrandHeader(sheet, `Relatório de ${MODEL_LABELS[input.kind]}`, input.periodLabel, input.filtersLabel);\n  let headerRowNumber: number | null = null;",
              1,
          )
          detail_header = "    const header = sheet.addRow(['Ordem', 'CTE / Manifesto', 'Emissão', 'Cliente', 'Motorista', 'Origem', 'Destino', 'Valor CTE', 'Frete', 'Despesas', 'Lucro', 'Status']);\n    styleTableHeader(header);"
          source = source.replace(detail_header, detail_header + "\n    headerRowNumber = header.number;", 1)
          source = source.replace(
              "  sheet.views = [{ state: 'frozen', ySplit: 5 }];\n  sheet.autoFilter = { from: { row: 5, column: 1 }, to: { row: 5, column: Math.max(1, sheet.columnCount) } };\n  autoFitColumns(sheet);",
              "  sheet.views = [{ state: 'frozen', ySplit: headerRowNumber || 4 }];\n  if (headerRowNumber !== null) {\n    sheet.autoFilter = {\n      from: { row: headerRowNumber, column: 1 },\n      to: { row: headerRowNumber, column: Math.max(1, sheet.columnCount) },\n    };\n  }\n  autoFitColumns(sheet);",
              1,
          )
          excel.write_text(source, encoding='utf-8')
          PY
      - name: Commit review fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/relatorios/reporting.css components/reports/ReportBuilder.tsx lib/reporting/periods.ts lib/reporting/excel.ts
          git commit -m "fix(reporting): address accessibility and export review [reporting-review-fixes-applied]"
          git push origin HEAD:feat/central-relatorios-dinamicos
